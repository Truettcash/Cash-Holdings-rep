[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cash-site-machine"
version = "0.1.0"
description = "Cash Site OS local execution node for Jarvis Main"
requires-python = ">=3.11"

[project.scripts]
cash-site-machine = "site_machine.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["site_machine*"]
