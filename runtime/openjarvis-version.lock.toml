# Immutable source identity for the future runtime bootstrap.
package = "openjarvis"
product = "OpenJarvis"
version = "1.0.3"
source_artifact = "openjarvis-1.0.3.tar.gz"
source_artifact_sha256 = "99a8beb3300289846ea7106132f3f20b144ac39659f6c6f59b053c839297d627"
distribution_source = "PyPI"
upstream_commit = "unavailable_from_distribution"
automatic_upgrades = false

# Generated installation and state are outside the repository checkout. The
# state path follows OpenJarvis' native OPENJARVIS_HOME convention.
installation_path = "~/.local/share/openjarvis/1.0.3"
openjarvis_home = "~/.openjarvis"
launcher_path = "~/.local/bin/jarvis"
cash_mcp_private_state_path = "~/.cash-mcp"
restore_gate = "verify_version_and_sha256_before_install"