# listed below have been recovered and reviewed.
operator:
  canonical_name: Cash Operator
  historical_runtime_id: 7d48d6150605
  historical_runtime_id_status: provenance_only
  runtime_id: generated_on_bootstrap
  identity_source: git
  prompt_source: runtime/agents/cash-operator.system.md
  prompt_copying: prohibited_from_memory

runtime:
